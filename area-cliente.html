    <p class="dash-lede" id="hello">Carregando…</p>
    <div class="dash-stats">
      <div class="dash-stat"><a href="pedidos.html"><div class="dash-stat-value" id="statOrders">—</div><div class="dash-stat-label">pedidos</div></a></div>
      <div class="dash-stat"><a href="orcamentos.html"><div class="dash-stat-value" id="statQuotes">—</div><div class="dash-stat-label">orçamentos</div></a></div>
      <div class="dash-stat"><a href="conta.html#checklists"><div class="dash-stat-value" id="statChecklists">—</div><div class="dash-stat-label">checklists</div></a></div>

    </div>

<script>
document.addEventListener('DOMContentLoaded', async function () {
  if (!(await IRNAuthGates.guardPage())) return;
  var u = await IRNAuth.user();
  document.getElementById('hello').textContent =
    'Olá' + (u && u.email ? ', ' + u.email.split('@')[0] : '') + '. Pedidos, orçamentos e entregas num só lugar.';
  var orders = [], quotes = [], checks = [];
  try { orders = await IRNAuth.listOrders(); } catch (e) {}
  try { quotes = await IRNAuth.listQuotes(); } catch (e) {}
  try { checks = await IRNAuth.listChecklists(); } catch (e) {}
  document.getElementById('statOrders').textContent = orders.length;
  document.getElementById('statQuotes').textContent = quotes.length;
  document.getElementById('statChecklists').textContent = checks.length;
  // notifications
  try {
    var notifs = await IRNAuth.listNotifications(10);
    var nbox = document.getElementById('notifList');
    if (nbox) {
      if (!notifs.length) nbox.innerHTML = '<p style="color:var(--dash-faint);font-size:13px">Nenhuma notificação.</p>';
      else {
        nbox.innerHTML = notifs.map(function(n){
          var unread = !n.read_at ? 'font-weight:600;' : '';
          return '<div style="padding:8px 0;border-bottom:1px solid var(--dash-border);' + unread + '">' +
            '<div style="font-size:13px">' + (n.title||'') + '</div>' +
            '<div style="font-size:12px;color:var(--dash-faint)">' + (n.body||'') + ' · ' +
            new Date(n.created_at).toLocaleString('pt-BR') + '</div></div>';
        }).join('');
      }
    }
    var markBtn = document.getElementById('markAllRead');
    if (markBtn) markBtn.onclick = async function(e){ e.preventDefault(); await IRNAuth.markAllNotificationsRead(); location.reload(); };
  } catch (e) {}
  var items = [];
  orders.slice(0, 5).forEach(function (o) {
    items.push({ t: o.created_at, label: '[pedido] ' + o.title + ' · ' + o.status });
  });
  quotes.slice(0, 5).forEach(function (q) {
    items.push({ t: q.created_at, label: '[orçamento] ' + q.title + ' · ' + q.status });
  });
  checks.slice(0, 5).forEach(function (c) {
    items.push({ t: c.created_at, label: '[checklist] ' + c.kind });
  });
  items.sort(function (a, b) { return new Date(b.t) - new Date(a.t); });
  var box = document.getElementById('activity');
  if (!items.length) {
    box.innerHTML = '<p style="color:var(--dash-faint);font-family:var(--dash-mono);font-size:13px">Nenhuma atividade ainda.</p>';
    return;
  }
  items.slice(0, 10).forEach(function (it) {
    var d = document.createElement('div');
    d.className = 'dash-list-item';
    d.innerHTML = '<div class="dash-list-head"><span>' +
      (it.t ? new Date(it.t).toLocaleString('pt-BR') : '') +
      '</span></div><div class="dash-list-body">' + it.label + '</div>';
    box.appendChild(d);
  });
});
</script>

<script>
(function(){
  try {
    var data = JSON.parse(localStorage.getItem('irn_python_progress')||'{}');
    var done = 0;
    for (var i=1;i<=8;i++) if(data[i]) done++;
    var host = document.querySelector('.dash-stats') || document.querySelector('.dash-main');
    if (!host) return;
    var card = document.createElement('div');
    card.className = 'dash-card';
    card.style.marginTop = '16px';
    card.innerHTML = '<div class="dash-card-title">curso python</div>' +
      '<p style="font-family:var(--dash-mono);font-size:13px;color:var(--dash-dim)">' + done + ' / 8 módulos concluídos</p>' +
      '<a href="cursos.html" class="dash-link-amber">continuar curso →</a>' +
      (done >= 8 ? ' · <a href="certificado-python.html" class="dash-link-amber">certificado</a>' : '');
    host.parentNode.insertBefore(card, host.nextSibling);
  } catch(e) {}
})();
</script>
  <script src="assets/js/chat-bot.js?v=20260917a" defer></script>
