<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área do cliente — IRN Devs</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://irndevs.com/area-cliente.html">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site-nav.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/css/dash-shell.css">
</head>
<body class="dash-app">
<div class="dash-shell">
  <aside class="dash-side">
    <div class="dash-side-brand"><span>$</span> portal</div>
    <a class="active" href="area-cliente.html">visão geral</a>
    <a href="pedidos.html">pedidos</a>
    <a href="orcamentos.html">orçamentos</a>
    <a href="conta.html">minha conta</a>
    <div class="dash-side-group">
      <div class="dash-side-label">site</div>
      <a href="ferramenta-checklist.html">checklist</a>
      <a href="contato.html">contato</a>
      <a href="index.html">← site público</a>
    </div>
  </aside>
  <main class="dash-main">
    <p class="dash-crumb"><a href="conta.html">conta</a> / portal</p>
    <h1 class="dash-h1">Área do cliente</h1>
    <p class="dash-lede" id="hello">Carregando…</p>
    <div class="dash-stats">
      <div class="dash-stat"><a href="pedidos.html"><div class="dash-stat-value" id="statOrders">—</div><div class="dash-stat-label">pedidos</div></a></div>
      <div class="dash-stat"><a href="orcamentos.html"><div class="dash-stat-value" id="statQuotes">—</div><div class="dash-stat-label">orçamentos</div></a></div>
      <div class="dash-stat"><a href="conta.html#checklists"><div class="dash-stat-value" id="statChecklists">—</div><div class="dash-stat-label">checklists</div></a></div>
      <div class="dash-stat"><div class="dash-stat-value" id="statStatus">OK</div><div class="dash-stat-label">status</div></div>
    </div>
    <div class="dash-card">
      <div class="dash-card-title">atividade recente</div>
      <div id="activity"></div>
    </div>
  </main>
</div>
<script src="assets/js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/auth-gates.js"></script>
<script src="assets/js/site-nav.js?v=20260914f" defer></script>
<script>
(async function () {
  if (!(await IRNAuthGates.guardPage())) return;
  var u = await IRNAuth.user();
  document.getElementById('hello').textContent =
    'Olá' + (u && u.email ? ', ' + u.email.split('@')[0] : '') + '. Pedidos, orçamentos e entregas num só lugar.';
  var orders = [], quotes = [], checks = [];
  try { orders = await IRNAuth.listOrders(); } catch (e) {}
  try { quotes = await IRNAuth.listQuotes(); } catch (e) {}
  try { checks = await IRNAuth.listChecklists(); } catch (e) {}
  document.getElementById('statOrders').textContent = orders.length;
  document.getElementById('statQuotes').textContent = quotes.length;
  document.getElementById('statChecklists').textContent = checks.length;
  var items = [];
  orders.slice(0, 5).forEach(function (o) {
    items.push({ t: o.created_at, label: '[pedido] ' + o.title + ' · ' + o.status });
  });
  quotes.slice(0, 5).forEach(function (q) {
    items.push({ t: q.created_at, label: '[orçamento] ' + q.title + ' · ' + q.status });
  });
  checks.slice(0, 5).forEach(function (c) {
    items.push({ t: c.created_at, label: '[checklist] ' + c.kind });
  });
  items.sort(function (a, b) { return new Date(b.t) - new Date(a.t); });
  var box = document.getElementById('activity');
  if (!items.length) {
    box.innerHTML = '<p style="color:var(--dash-faint);font-family:var(--dash-mono);font-size:13px">Nenhuma atividade ainda.</p>';
    return;
  }
  items.slice(0, 10).forEach(function (it) {
    var d = document.createElement('div');
    d.className = 'dash-list-item';
    d.innerHTML = '<div class="dash-list-head"><span>' +
      (it.t ? new Date(it.t).toLocaleString('pt-BR') : '') +
      '</span></div><div class="dash-list-body">' + it.label + '</div>';
    box.appendChild(d);
  });
})();
</script>
</body>
</html>
