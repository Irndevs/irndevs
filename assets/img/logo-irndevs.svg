<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="IRN Devs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121610"/>
      <stop offset="100%" stop-color="#0c0e0b"/>
    </linearGradient>
    <linearGradient id="amberG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0b54a"/>
      <stop offset="100%" stop-color="#e8a33d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- window -->
  <rect width="560" height="160" rx="12" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="557" height="157" rx="11" fill="none" stroke="#2a3126" stroke-width="1.5"/>
  <!-- titlebar -->
  <rect x="1.5" y="1.5" width="557" height="28" rx="11" fill="#171b16"/>
  <rect x="1.5" y="16" width="557" height="14" fill="#171b16"/>
  <circle cx="22" cy="16" r="5" fill="#c45c5c" opacity="0.85"/>
  <circle cx="40" cy="16" r="5" fill="#e8a33d" opacity="0.75"/>
  <circle cx="58" cy="16" r="5" fill="#7fae6a" opacity="0.8"/>
  <text x="280" y="20" text-anchor="middle" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#5c6157">irn@serv — zsh</text>
  <!-- prompt line -->
  <text x="28" y="100" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="44" font-weight="600">
    <tspan fill="#7fae6a">~/</tspan><tspan fill="#eae6d9">irndevs</tspan><tspan fill="#5c6157"> </tspan><tspan fill="url(#amberG)" filter="url(#glow)">$</tspan>
  </text>
  <!-- blinking cursor -->
  <rect x="420" y="68" width="14" height="36" fill="#e8a33d">
    <animate attributeName="opacity" values="1;0.12;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
