<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="IRN Devs">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141814"/>
      <stop offset="100%" stop-color="#0c0e0b"/>
    </linearGradient>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#mbg)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#2a3126" stroke-width="2"/>
  <!-- mini traffic lights -->
  <circle cx="22" cy="22" r="3.5" fill="#c45c5c" opacity="0.7"/>
  <circle cx="34" cy="22" r="3.5" fill="#e8a33d" opacity="0.7"/>
  <circle cx="46" cy="22" r="3.5" fill="#7fae6a" opacity="0.7"/>
  <!-- core mark -->
  <text x="64" y="82" text-anchor="middle" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="38" font-weight="700" letter-spacing="1">
    <tspan fill="#7fae6a">~/</tspan><tspan fill="#e8a33d" filter="url(#g)">$</tspan>
  </text>
</svg>
