<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Stack IRN Devs">
  <rect width="720" height="320" fill="#10130f"/>
  <text x="24" y="32" font-family="monospace" font-size="13" fill="#e8a33d">$ architecture --overview</text>
  <!-- boxes -->
  <rect x="40" y="60" width="160" height="70" rx="6" fill="#171b16" stroke="#2a3126"/>
  <text x="120" y="90" text-anchor="middle" font-family="monospace" font-size="13" fill="#7fae6a">Proxmox / bare-metal</text>
  <text x="120" y="112" text-anchor="middle" font-family="monospace" font-size="11" fill="#8f9587">VMs · LXC · ZFS</text>

  <rect x="280" y="60" width="160" height="70" rx="6" fill="#171b16" stroke="#2a3126"/>
  <text x="360" y="90" text-anchor="middle" font-family="monospace" font-size="13" fill="#7fae6a">k3s cluster</text>
  <text x="360" y="112" text-anchor="middle" font-family="monospace" font-size="11" fill="#8f9587">Ingress · Helm · GitOps</text>

  <rect x="520" y="60" width="160" height="70" rx="6" fill="#171b16" stroke="#2a3126"/>
  <text x="600" y="90" text-anchor="middle" font-family="monospace" font-size="13" fill="#7fae6a">Apps / APIs</text>
  <text x="600" y="112" text-anchor="middle" font-family="monospace" font-size="11" fill="#8f9587">SaaS · automações</text>

  <rect x="160" y="180" width="400" height="90" rx="6" fill="#171b16" stroke="#e8a33d" stroke-opacity="0.5"/>
  <text x="360" y="215" text-anchor="middle" font-family="monospace" font-size="14" fill="#e8a33d">Observabilidade</text>
  <text x="360" y="240" text-anchor="middle" font-family="monospace" font-size="12" fill="#8f9587">Grafana · Prometheus · Loki · OpenTelemetry</text>

  <!-- arrows simple -->
  <path d="M200 95 H280" stroke="#5c6157" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M440 95 H520" stroke="#5c6157" stroke-width="1.5"/>
  <path d="M360 130 V180" stroke="#5c6157" stroke-width="1.5"/>
</svg>
