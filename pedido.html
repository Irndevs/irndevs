<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhe do pedido — IRN Devs</title>
<meta name="description" content="Acompanhe o status, mensagens e arquivos do seu pedido na IRN Devs. Acesso restrito à sua conta.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site-nav.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/css/dash-shell.css">
<link rel="stylesheet" href="assets/css/motion.css">
<style>
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { position: relative; padding: 12px 0 12px 28px; border-left: 2px solid var(--dash-border); margin-left: 8px; }
  .timeline li::before { content: ''; position: absolute; left: -6px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--dash-amber); }
  .timeline .ev-date { font-size: 12px; color: var(--dash-faint); font-family: var(--dash-mono); }
  .timeline .ev-text { font-size: 14px; margin-top: 2px; }
  .status-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-family: var(--dash-mono); border: 1px solid var(--dash-border); }
  .status-recebido, .status-aberto { color: #8ab0e0; }
  .status-em_analise, .status-em_execucao, .status-em_andamento { color: var(--dash-amber); }
  .status-aguardando_cliente { color: #e0c080; }
  .status-entregue { color: var(--dash-green); }
  .status-cancelado { color: #e88; }
  .file-row, .msg-row { padding: 10px 0; border-bottom: 1px solid var(--dash-border); font-size: 14px; }
  .msg-row.admin { border-left: 3px solid var(--dash-amber); padding-left: 10px; }
  .upload-zone { border: 1px dashed var(--dash-border); border-radius: 10px; padding: 16px; text-align: center; margin-top: 12px; }
  .upload-zone input { max-width: 100%; }
  .msg-form { display: flex; gap: 8px; margin-top: 12px; }
  .msg-form input { flex: 1; background: var(--dash-raised); border: 1px solid var(--dash-border); color: var(--dash-text); padding: 10px 12px; border-radius: 8px; }
  .msg-form button { background: var(--dash-amber); color: #10130f; border: 0; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body class="dash-app">
<div class="dash-shell">
  <aside class="dash-side">
    <div class="dash-side-brand"><span>$</span> portal</div>
    <a href="area-cliente.html">visão geral</a>
    <a class="active" href="pedidos.html">pedidos</a>
    <a href="orcamentos.html">orçamentos</a>
    <a href="conta.html">minha conta</a>
    <div class="dash-side-group"><a href="index.html">← site público</a></div>
  </aside>
  <main class="dash-main">
    <p class="dash-crumb"><a href="area-cliente.html">portal</a> / <a href="pedidos.html">pedidos</a> / <span id="crumbId">#—</span></p>
    <h1 class="dash-h1" id="title">Carregando…</h1>
    <p class="dash-lede"><span class="status-badge" id="statusBadge">—</span>
      <span id="amount" style="margin-left:12px;color:var(--dash-dim)"></span>
      <span id="expected" style="margin-left:12px;color:var(--dash-faint);font-size:13px"></span>
    </p>

    <div class="dash-card" style="margin-bottom:16px">
      <div class="dash-card-title">notas</div>
      <p id="notes" style="color:var(--dash-dim);font-size:14px;white-space:pre-wrap">—</p>
    </div>

    <div class="dash-card" style="margin-bottom:16px">
      <div class="dash-card-title">timeline</div>
      <ul class="timeline" id="timeline"><li><span class="ev-text">Carregando…</span></li></ul>
    </div>

    <div class="dash-card" style="margin-bottom:16px">
      <div class="dash-card-title">arquivos</div>
      <div id="files"><p style="color:var(--dash-faint);font-size:13px">Nenhum arquivo.</p></div>
      <div class="upload-zone">
        <input type="file" id="fileInput" />
        <button type="button" id="btnUpload" style="margin-top:8px;background:var(--dash-amber);color:#10130f;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600">enviar arquivo</button>
        <p id="uploadMsg" style="font-size:12px;color:var(--dash-faint);margin-top:6px"></p>
      </div>
    </div>

    <div class="dash-card">
      <div class="dash-card-title">mensagens</div>
      <div id="messages"><p style="color:var(--dash-faint);font-size:13px">Nenhuma mensagem.</p></div>
      <div class="msg-form">
        <input type="text" id="msgInput" placeholder="Escreva uma mensagem…" maxlength="2000" />
        <button type="button" id="btnMsg">enviar</button>
      </div>
    </div>
  </main>
</div>
<script src="assets/js/supabase-config.js" defer></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="assets/js/auth.js" defer></script>
<script src="assets/js/auth-gates.js" defer></script>
<script src="assets/js/site-nav.js?v=20260917a" defer></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  if (!(await IRNAuthGates.guardPage())) return;
  var params = new URLSearchParams(location.search);
  var id = parseInt(params.get('id'), 10);
  if (!id) { location.replace('pedidos.html'); return; }

  var order = null;
  try { order = await IRNAuth.getOrder(id); } catch (e) {
    document.getElementById('title').textContent = 'Erro ao carregar';
    return;
  }
  if (!order) { document.getElementById('title').textContent = 'Pedido não encontrado'; return; }

  document.getElementById('crumbId').textContent = '#' + order.id;
  document.getElementById('title').textContent = order.title || ('Pedido #' + order.id);
  var badge = document.getElementById('statusBadge');
  badge.textContent = order.status || '—';
  badge.className = 'status-badge status-' + (order.status || '');
  if (order.amount_cents != null) {
    document.getElementById('amount').textContent = (order.amount_cents / 100).toLocaleString('pt-BR', { style: 'currency', currency: order.currency || 'BRL' });
  }
  if (order.expected_delivery) {
    document.getElementById('expected').textContent = 'entrega prevista: ' + order.expected_delivery;
  }
  document.getElementById('notes').textContent = order.notes || 'Sem notas.';

  // Timeline
  var events = [];
  try { events = await IRNAuth.listOrderEvents(id); } catch (e) {}
  var tl = document.getElementById('timeline');
  if (!events.length) {
    tl.innerHTML = '<li><span class="ev-date">' + new Date(order.created_at).toLocaleString('pt-BR') + '</span><div class="ev-text">Pedido criado · status: ' + order.status + '</div></li>';
  } else {
    tl.innerHTML = events.map(function (ev) {
      return '<li><span class="ev-date">' + new Date(ev.created_at).toLocaleString('pt-BR') + '</span><div class="ev-text">' +
        (ev.from_status ? ev.from_status + ' → ' : '') + (ev.to_status || ev.event_type) +
        (ev.note ? ' · ' + ev.note : '') + '</div></li>';
    }).join('');
  }

  // Files
  async function loadFiles() {
    var files = [];
    try { files = await IRNAuth.listOrderFiles(id); } catch (e) {}
    var box = document.getElementById('files');
    if (!files.length) { box.innerHTML = '<p style="color:var(--dash-faint);font-size:13px">Nenhum arquivo.</p>'; return; }
    box.innerHTML = '';
    for (var i = 0; i < files.length; i++) {
      (function (f) {
        var row = document.createElement('div');
        row.className = 'file-row';
        row.innerHTML = '<strong>' + f.file_name + '</strong> <span style="color:var(--dash-faint);font-size:12px">' +
          (f.file_size ? (f.file_size / 1024).toFixed(1) + ' KB' : '') + ' · ' +
          new Date(f.created_at).toLocaleString('pt-BR') + '</span> ';
        var a = document.createElement('a');
        a.href = '#'; a.textContent = 'baixar'; a.style.marginLeft = '8px';
        a.onclick = async function (e) {
          e.preventDefault();
          try {
            var url = await IRNAuth.getFileUrl(f.file_path);
            window.open(url, '_blank');
          } catch (err) { alert(err.message || err); }
        };
        row.appendChild(a);
        box.appendChild(row);
      })(files[i]);
    }
  }
  await loadFiles();

  document.getElementById('btnUpload').onclick = async function () {
    var input = document.getElementById('fileInput');
    var msg = document.getElementById('uploadMsg');
    if (!input.files || !input.files[0]) { msg.textContent = 'Selecione um arquivo.'; return; }
    msg.textContent = 'Enviando…';
    try {
      await IRNAuth.uploadOrderFile(id, input.files[0]);
      msg.textContent = 'Enviado.';
      input.value = '';
      await loadFiles();
    } catch (e) {
      msg.textContent = 'Erro: ' + (e.message || e) + ' (configure o bucket order-files no Supabase Storage)';
    }
  };

  // Messages
  async function loadMessages() {
    var msgs = [];
    try { msgs = await IRNAuth.listOrderMessages(id); } catch (e) {}
    var box = document.getElementById('messages');
    if (!msgs.length) { box.innerHTML = '<p style="color:var(--dash-faint);font-size:13px">Nenhuma mensagem.</p>'; return; }
    box.innerHTML = msgs.map(function (m) {
      return '<div class="msg-row' + (m.is_admin ? ' admin' : '') + '"><div style="font-size:12px;color:var(--dash-faint)">' +
        new Date(m.created_at).toLocaleString('pt-BR') + (m.is_admin ? ' · equipe' : ' · você') +
        '</div><div>' + (m.body || '').replace(/</g, '&lt;') + '</div></div>';
    }).join('');
  }
  await loadMessages();

  document.getElementById('btnMsg').onclick = async function () {
    var input = document.getElementById('msgInput');
    var body = (input.value || '').trim();
    if (!body) return;
    try {
      await IRNAuth.sendOrderMessage(id, body);
      input.value = '';
      await loadMessages();
    } catch (e) { alert(e.message || e); }
  };
});
</script>
</body>
</html>
