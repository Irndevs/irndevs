<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo: Gerador SQL local — IRN Devs</title>
<meta name="description" content="Motor local: descreva em português e gere SQL (Postgres/MySQL) ou aggregation MongoDB no browser.">
<link rel="stylesheet" href="assets/css/pages/ia.css">
<link rel="stylesheet" href="assets/css/site-nav.css">
<link rel="stylesheet" href="assets/css/motion.css">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://irndevs.com/demo-sql.html">
<style>
  .demo-wrap{max-width:900px;margin:0 auto;padding:0 28px 60px}
  .demo-hero{padding:36px 0 28px}
  .demo-hero h1{font-size:26px;font-weight:700;margin:10px 0 12px}
  .demo-hero p{color:var(--text-dim,#a8b0a0);font-size:15px;max-width:640px}
  .demo-kicker{font-family:var(--mono,monospace);font-size:12px;color:var(--ia-amber,#c9a227);display:flex;align-items:center;gap:8px}
  .demo-panel{background:var(--bg-raised,#161a14);border:1px solid var(--border,#2a3028);padding:20px;margin-bottom:20px}
  .demo-panel label{display:block;font-family:var(--mono,monospace);font-size:12px;color:var(--ia-amber,#c9a227);margin-bottom:8px}
  .demo-panel textarea,.demo-panel select{width:100%;background:#0c0e0b;border:1px solid var(--border,#2a3028);color:#b8c4a8;font-family:var(--mono,monospace);font-size:13px;padding:12px 14px;box-sizing:border-box}
  .demo-panel textarea{min-height:100px;resize:vertical}
  .demo-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .demo-btn{font-family:var(--mono,monospace);font-size:13px;padding:10px 16px;background:transparent;border:1px solid var(--ia-amber,#c9a227);color:var(--ia-amber,#c9a227);cursor:pointer}
  .demo-btn:hover{background:var(--ia-amber,#c9a227);color:#10130f}
  .demo-btn.primary{background:var(--ia-amber,#c9a227);color:#10130f;font-weight:600}
  .demo-btn.secondary{border-color:var(--border,#2a3028);color:var(--text-dim,#a8b0a0)}
  .demo-result{background:#0c0e0b;border:1px solid var(--border,#2a3028);padding:16px 18px;font-family:var(--mono,monospace);font-size:12.5px;line-height:1.5;color:#7dcea0;white-space:pre-wrap;max-height:380px;overflow:auto;min-height:72px}
  .demo-result.empty{color:var(--text-faint,#5a6258)}
  .demo-meta{font-family:var(--mono,monospace);font-size:11px;color:var(--text-faint,#5a6258);margin-top:10px}
  .demo-ex{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .demo-ex button{font-family:var(--mono,monospace);font-size:11px;padding:6px 10px;border:1px solid var(--border,#2a3028);color:var(--text-dim,#a8b0a0);background:transparent;cursor:pointer}
  .demo-ex button:hover{border-color:var(--ia-amber,#c9a227);color:var(--ia-amber,#c9a227)}
  .row{display:grid;grid-template-columns:1fr 160px;gap:12px}
  @media(max-width:560px){.row{grid-template-columns:1fr}}
  .badge{font-size:10px;border:1px solid var(--ia-amber,#c9a227);color:var(--ia-amber,#c9a227);padding:2px 7px;margin-left:8px;font-family:monospace}
</style>
</head>
<body>
<div class="wrap crumb"><a href="index.html">~</a> / <a href="ia.html">ia</a> / <span>demo-sql</span></div>
<div class="demo-wrap">
  <header class="demo-hero">
    <div class="demo-kicker"><span class="pulse-dot"></span> motor local · NL → SQL</div>
    <h1>Gerador SQL / NoSQL <span class="badge">MOTOR LOCAL</span></h1>
    <p>Descreva em português. O motor local infere tabela, filtros, ordenação e LIMIT. Para queries complexas, use o prompt para LLM.</p>
  </header>
  <div class="demo-panel">
    <div class="row">
      <div>
        <label for="pedido">pedido em português</label>
        <textarea id="pedido" placeholder="Buscar os 10 usuários mais ativos que compraram nos últimos 30 dias..."></textarea>
      </div>
      <div>
        <label for="dialect">dialeto</label>
        <select id="dialect">
          <option value="postgres">PostgreSQL</option>
          <option value="mysql">MySQL</option>
          <option value="mongo">MongoDB</option>
        </select>
      </div>
    </div>
    <div class="demo-ex">
      <button type="button" data-ex="ativos">usuários ativos 30d</button>
      <button type="button" data-ex="count">contar pedidos</button>
      <button type="button" data-ex="email">por e-mail</button>
    </div>
    <div class="demo-actions">
      <button type="button" class="demo-btn primary" id="btnGen">gerar SQL local</button>
      <button type="button" class="demo-btn secondary" id="btnPrompt">copiar prompt IA</button>
      <button type="button" class="demo-btn secondary" id="btnCopy" disabled>copiar saída</button>
      <button type="button" class="demo-btn secondary" id="btnClear">limpar</button>
    </div>
  </div>
  <div class="demo-panel">
    <label>saída</label>
    <div class="demo-result empty" id="resultBox">descreva o pedido e clique em gerar</div>
    <div class="demo-meta" id="resultMeta"></div>
  </div>
  <p style="margin-top:28px;font-family:var(--mono,monospace);font-size:13px;color:var(--text-faint,#5a6258)">
    <a href="ia.html" style="color:var(--ia-amber,#c9a227)">← hub de IA</a>
  </p>
</div>
<script src="assets/js/sql-engine.js?v=20260916v8"></script>
<script src="assets/js/ia-history.js?v=20260916v8"></script>
<script src="assets/js/site-nav.js?v=20260916d" defer></script>
<script>
(function(){
  var examples = {
    ativos: 'Buscar os 10 usuários mais ativos que compraram nos últimos 30 dias, ordenados por total gasto',
    count: 'Quantos pedidos foram feitos nos últimos 7 dias?',
    email: 'Buscar usuário com email ana.silva@email.com'
  };
  var pedido = document.getElementById('pedido');
  var dialect = document.getElementById('dialect');
  var resultBox = document.getElementById('resultBox');
  var resultMeta = document.getElementById('resultMeta');
  var btnGen = document.getElementById('btnGen');
  var btnPrompt = document.getElementById('btnPrompt');
  var btnCopy = document.getElementById('btnCopy');
  var btnClear = document.getElementById('btnClear');

  document.querySelectorAll('.demo-ex button').forEach(function(b){
    b.addEventListener('click', function(){ pedido.value = examples[b.getAttribute('data-ex')] || ''; });
  });

  function show(text, meta){
    resultBox.textContent = text;
    resultBox.classList.remove('empty');
    resultMeta.textContent = meta || '';
    btnCopy.disabled = false;
  }

  btnGen.addEventListener('click', function(){
    var r = IRNSql.generate(pedido.value, { dialect: dialect.value });
    if (!r) {
      resultBox.textContent = 'escreva um pedido primeiro';
      resultBox.classList.add('empty');
      btnCopy.disabled = true;
      return;
    }
    var out = r.sql + (r.notes && r.notes.length ? '\n\n-- ' + r.notes.join('\n-- ') : '');
    show(out, 'motor local · ' + r.dialect + ' · revise colunas do seu schema');
    if (window.IRNHistory) IRNHistory.push({ tool: 'sql', title: pedido.value.slice(0, 60), content: out });
  });

  btnPrompt.addEventListener('click', function(){
    if (!pedido.value.trim()) return;
    var t = IRNSql.promptForAI(pedido.value);
    navigator.clipboard.writeText(t).then(function(){
      btnPrompt.textContent = 'prompt copiado!';
      setTimeout(function(){ btnPrompt.textContent = 'copiar prompt IA'; }, 1600);
    });
  });

  btnCopy.addEventListener('click', function(){
    if (resultBox.classList.contains('empty')) return;
    navigator.clipboard.writeText(resultBox.textContent);
  });

  btnClear.addEventListener('click', function(){
    pedido.value = '';
    resultBox.textContent = 'descreva o pedido e clique em gerar';
    resultBox.classList.add('empty');
    resultMeta.textContent = '';
    btnCopy.disabled = true;
  });
})();
</script>
</body>
</html>
