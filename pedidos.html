<body class="dash-app">
<div class="dash-shell">
  <aside class="dash-side">
    <div class="dash-side-brand"><span>$</span> portal</div>
    <a href="area-cliente.html">visão geral</a>
    <a class="active" href="pedidos.html">pedidos</a>
    <a  href="orcamentos.html">orçamentos</a>
    <a href="conta.html">minha conta</a>
    <div class="dash-side-group">
      <a href="index.html">← site público</a>
    </div>
  </aside>
  <main class="dash-main">
    <p class="dash-crumb"><a href="area-cliente.html">portal</a> / pedidos</p>
    <h1 class="dash-h1">Pedidos</h1>
    <p class="dash-lede">Acompanhe status e histórico.</p>
    <div class="dash-stats">
      <div class="dash-stat"><div class="dash-stat-value" id="statTotal">—</div><div class="dash-stat-label">total</div></div>
      <div class="dash-stat"><div class="dash-stat-value" id="statA">—</div><div class="dash-stat-label">ativos</div></div>
      <div class="dash-stat"><div class="dash-stat-value" id="statB">—</div><div class="dash-stat-label">concluídos</div></div>
    </div>
    <div class="dash-card"><div id="list"></div></div>
  </main>
</div>
<script src="assets/js/supabase-config.js" defer></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="assets/js/auth.js" defer></script>
<script src="assets/js/auth-gates.js" defer></script>
<script src="assets/js/site-nav.js?v=20260916c" defer></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  if (!(await IRNAuthGates.guardPage())) return;
  var box = document.getElementById('list');
  var rows = [];
  try { rows = await IRNAuth.listOrders(); }
  catch (e) {
    box.innerHTML = '<p style="color:#e88;font-family:var(--dash-mono);font-size:13px">Erro: ' + (e.message||e) + '. Rode supabase/schema.sql se as tabelas não existirem.</p>';
    return;
  }
  document.getElementById('statTotal').textContent = rows.length;
  var active = rows.filter(function (r) {
    return ['aberto','em_andamento','aguardando_cliente','enviado','em_analise','rascunho'].indexOf(r.status) !== -1;
  }).length;
  var done = rows.filter(function (r) {
    return ['entregue','aprovado'].indexOf(r.status) !== -1;
  }).length;
  document.getElementById('statA').textContent = active;
  document.getElementById('statB').textContent = done;
  if (!rows.length) {
    box.innerHTML = '<p style="color:var(--dash-faint);font-family:var(--dash-mono);font-size:13px">Nenhum registro ainda.</p>';
    return;
  }
  function money(c, cur) {
    if (c == null) return '—';
    try { return (c/100).toLocaleString('pt-BR',{style:'currency',currency:cur||'BRL'}); }
    catch(e){ return (c/100).toFixed(2); }
  }
  var activeStatuses = ['recebido','em_analise','em_execucao','aguardando_cliente','aberto','em_andamento'];
  var doneStatuses = ['entregue'];
  document.getElementById('statA').textContent = rows.filter(function(r){ return activeStatuses.indexOf(r.status)!==-1; }).length;
  document.getElementById('statB').textContent = rows.filter(function(r){ return doneStatuses.indexOf(r.status)!==-1; }).length;
  rows.forEach(function (r) {
    var d = document.createElement('div');
    d.className = 'dash-list-item';
    d.style.cursor = 'pointer';
    d.onclick = function(){ location.href = 'pedido.html?id=' + r.id; };
    d.innerHTML = '<div class="dash-list-head"><span>#' + r.id + ' · ' + (r.status||'') + '</span><span>' +
      money(r.amount_cents, r.currency) + '</span></div><div class="dash-list-body">' +
      (r.title||'') + (r.notes ? '<br>' + r.notes : '') + '<br>' +
      (r.created_at ? new Date(r.created_at).toLocaleString('pt-BR') : '') +
      '</div><div style="margin-top:6px;font-size:12px;color:var(--dash-amber)">ver detalhe →</div>';
    box.appendChild(d);
  });
});
</script>
  <script src="assets/js/chat-bot.js?v=20260916e" defer></script>
</body>
</html>
